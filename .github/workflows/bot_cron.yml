name: OLX Telegram Bot Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-bot:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # WYMUSZENIE POPRAWNYCH DANYCH: Nadpisujemy zmienne bezpośrednio w środowisku systemu
    - name: Run Bot Script
      env:
        TELEGRAM_TOKEN: "8933900136:AAGPxiJd2EbGqIXJl2wbr6HWOCwSEsa9TO4"
        RSS_JSON_URL: ${{ secrets.RSS_JSON_URL }}
      run: |
        # Dynamiczna naprawa starego pliku bot.py w locie przed jego uruchomieniem
        python -c "
        with open('bot.py', 'r', encoding='utf-8') as f:
            text = f.read()
        # Wycinamy błędny ciąg z adresu URL, który powodował crash w starej wersji
        text = text.replace('https://telegram.orgukryty_token', 'https://telegram.org')
        text = text.replace('https://telegram.org', 'https://telegram.org')
        with open('bot.py', 'w', encoding='utf-8') as f:
            f.write(text)
        "
        python bot.py

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automatyczna aktualizacja bazy ofert [skip ci]"
        file_pattern: 'wyslane_oferty.txt'
        skip_dirty_check: false
