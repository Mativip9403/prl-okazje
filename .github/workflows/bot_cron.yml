name: OLX Telegram Bot Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write # Wymagane uprawnienie do zapisu bazy

jobs:
  run-bot:
    runs-on: ubuntu-24.04

    steps:
    # 1. Pobranie kodu (z parametrem tokenu)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 2. Instalacja Pythona
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalacja wymaganych bibliotek
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Uruchomienie skryptu bota
    - name: Run Bot Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        RSS_JSON_URL: ${{ secrets.RSS_JSON_URL }}
      run: python bot.py

    # 5. GOTOWA AKCJA: Automatyczny i bezpieczny zapis bazy danych
    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automatyczna aktualizacja bazy ofert [skip ci]"
        file_pattern: 'wyslane_oferty.txt'
        skip_dirty_check: false
