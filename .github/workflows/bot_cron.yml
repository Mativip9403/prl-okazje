name: OLX Telegram Bot Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-bot:
    runs-on: ubuntu-24.04 # Zablokowane na stabilnej wersji Ubuntu zgodnie z wytycznymi CI

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Zapewnia utrzymanie uprawnień do zapisu dla git push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Bot Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        RSS_JSON_URL: ${{ secrets.RSS_JSON_URL }}
      run: python bot.py

    - name: Commit and Push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Wstrzyknięcie tokenu autoryzacyjnego
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add wyslane_oferty.txt
        
        # Bezpieczne wykonanie commit i push przy użyciu poprawnego adresu URL z tokenem
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Automatyczna aktualizacja bazy ofert [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@://github.com{{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}
        else
          print("Brak nowych ofert do zapisania w bazie.")
        fi
