name: OLX Telegram Bot Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-bot:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Bot Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        RSS_JSON_URL: ${{ secrets.RSS_JSON_URL }}
      run: python bot.py

    - name: Commit and Push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add wyslane_oferty.txt
        
        # Poprawiono warunek i zamieniono 'print' na systemowe 'echo'
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Automatyczna aktualizacja bazy ofert [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@://github.com{{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "Brak nowych ofert do zapisania w bazie."
        fi
