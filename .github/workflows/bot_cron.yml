name: OLX Telegram Bot Cron

on:
  schedule:
    # Uruchamiaj co 15 minut (Możesz zmienić np. na '*/10 * * * *' dla 10 minut)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Pozwala na ręczne uruchomienie bota przyciskiem na GitHubie

permissions:
  contents: write # Daje botowi uprawnienia do zapisywania zmian (push) w repozytorium

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. Pobranie kodu z repozytorium
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Instalacja Pythona
    - name: Set up Python
      uses: actions/configure-pages@v5 # Służy do konfiguracji środowiska bazowego lub bezpośrednio:
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalacja wymaganych bibliotek
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Uruchomienie skryptu bota z przekazaniem ukrytych zmiennych (Secrets)
    - name: Run Bot Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        RSS_JSON_URL: ${{ secrets.RSS_JSON_URL }}
      run: python bot.py

    # 5. Automatyczny zapis (Commit i Push) zaktualizowanego pliku wyslane_oferty.txt
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add wyslane_oferty.txt
        # Commit wykona się tylko wtedy, gdy pojawiły się nowe ogłoszenia i plik się zmienił
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja bazy ofert [skip ci]" && git push)
